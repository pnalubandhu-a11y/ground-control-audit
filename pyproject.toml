[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ground-control-audit"
version = "0.1.0"
description = "audit — CoreWeave GPU-fabric flight director (Moonshot hackathon)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
audit = "audit.cli:main"

[tool.setuptools.packages.find]
include = ["audit*"]

[tool.setuptools.package-data]
audit = ["bundles/*.yaml", "verdicts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
